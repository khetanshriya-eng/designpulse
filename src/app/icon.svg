<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#5b3df5"/>
  <!-- navy drop shadow (offset down-right) -->
  <g fill="#1a1340">
    <rect x="20" y="6" width="5" height="21"/>
    <rect x="8" y="16" width="17" height="11"/>
  </g>
  <!-- lime lowercase "d": tall stem (right) + bowl (lower-left) -->
  <g fill="#d4ff3f">
    <rect x="19" y="5" width="5" height="21"/>
    <rect x="7" y="15" width="17" height="11"/>
  </g>
  <!-- tall narrow counter punched back to purple -->
  <rect x="11" y="17" width="4" height="7" fill="#5b3df5"/>
</svg>
