<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 30 30">
  <!-- purple rounded square -->
  <rect width="30" height="30" rx="7" fill="#5b3df5"/>
  <!-- navy drop shadow (offset down-right) -->
  <g fill="#1a1340">
    <rect x="19" y="5" width="6" height="22"/>
    <rect x="7" y="15" width="18" height="12"/>
  </g>
  <!-- lime lowercase "d": tall stem (right) + bowl (lower-left) -->
  <g fill="#d4ff3f">
    <rect x="18" y="4" width="6" height="22"/>
    <rect x="6" y="14" width="18" height="12"/>
  </g>
  <!-- counter (hole) punched back to the purple -->
  <rect x="10" y="16" width="6" height="6" fill="#5b3df5"/>
</svg>
